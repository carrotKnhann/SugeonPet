<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('sugeonpet_theme')
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark')
          var l = localStorage.getItem('sugeonpet_lang')
          document.documentElement.setAttribute('lang', l === 'en' ? 'en' : 'vi')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
        var w = window.innerWidth || 1024
        var d = w >= 1440 ? 'pc' : w >= 1024 ? 'laptop' : w >= 640 ? 'tablet' : 'phone'
        document.documentElement.setAttribute('data-device', d)
      })()
    </script>
